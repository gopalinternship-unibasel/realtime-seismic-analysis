services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seismic}
      POSTGRES_USER: ${POSTGRES_USER:-seismic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seismic}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seismic} -d ${POSTGRES_DB:-seismic}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "9092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-seismic-events}
    command: >
      bash -lc "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --create --if-not-exists --topic $${KAFKA_TOPIC}
      --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
      --describe --topic $${KAFKA_TOPIC}"

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: >
      bash -lc "$$SPARK_HOME/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./src:/opt/workspace/src
      - ./data:/opt/workspace/data

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      - spark-master
    command: >
      bash -lc "$$SPARK_HOME/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 2 --memory 2G --webui-port 8081"
    ports:
      - "8081:8081"
    volumes:
      - ./src:/opt/workspace/src
      - ./data:/opt/workspace/data

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      - spark-master
    command: >
      bash -lc "$$SPARK_HOME/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 2 --memory 2G --webui-port 8082"
    ports:
      - "8082:8082"
    volumes:
      - ./src:/opt/workspace/src
      - ./data:/opt/workspace/data

  streaming-job:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seismic}
      POSTGRES_USER: ${POSTGRES_USER:-seismic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seismic}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-seismic-events}
      KAFKA_STARTING_OFFSETS: earliest

      CHECKPOINT_DIR: /opt/workspace/data/checkpoints/seismic_stream
      BASELINE_CSV: /opt/workspace/data/baseline/cell_baselines.csv
      Z_THRESHOLD: ${Z_THRESHOLD:-2.0}
      MIN_EVENTS_FOR_ANOMALY: ${MIN_EVENTS_FOR_ANOMALY:-3}
    command: >
      bash -lc "sleep 8 && spark-submit --master $${SPARK_MASTER_URL}
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5
      --conf spark.sql.shuffle.partitions=8
      src/streaming/streaming_job.py"
    volumes:
      - ./src:/opt/workspace/src
      - ./data:/opt/workspace/data

  replay-producer:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["replay"]
    depends_on:
      streaming-job:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-seismic-events}
      REPLAY_FILE: /opt/workspace/data/replay_catalog/sample_replay_events.jsonl
      EVENTS_PER_BATCH: 25
      REPLAY_SLEEP_SECONDS: 3
    command: bash -lc "python src/producer/replay_producer.py"
    volumes:
      - ./src:/opt/workspace/src
      - ./data:/opt/workspace/data

  live-producer:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["live"]
    depends_on:
      streaming-job:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-seismic-events}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      USGS_URL: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson
    command: bash -lc "python src/producer/live_usgs_producer.py"
    volumes:
      - ./src:/opt/workspace/src
      - ./data:/opt/workspace/data

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seismic}
      POSTGRES_USER: ${POSTGRES_USER:-seismic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seismic}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DASH_HOST: 0.0.0.0
      DASH_PORT: 8050
    ports:
      - "8050:8050"
    volumes:
      - ./src:/opt/workspace/src

volumes:
  pgdata: